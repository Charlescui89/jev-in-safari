[project]
name = "jev-safari"
version = "0.1.0a1"
description = "Jev in Safari: a native Safari WebDriver adapter for Jev Ultrafast"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1", "python-dotenv>=1,<2"]

[project.urls]
Repository = "https://github.com/Charlescui89/jev-in-safari"
Issues = "https://github.com/Charlescui89/jev-in-safari/issues"

[project.scripts]
jev-safari = "jev_safari.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_safari"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
